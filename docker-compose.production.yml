version: '3.8'

services:
  # ── Backend API ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file: ./backend/.env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ── Frontend (built + served by backend in production) ──
  # In production, frontend is built and served as static files by backend

  # ── Agent Worker ──
  agent:
    build:
      context: ./sondos-agent
      dockerfile: Dockerfile
    env_file: ./sondos-agent/.env
    depends_on:
      - backend
    restart: unless-stopped

  # ── Analysis Worker ──
  analysis-worker:
    build:
      context: ./analysis-worker
      dockerfile: Dockerfile
    env_file: ./analysis-worker/.env
    depends_on:
      - backend
      - redis
    restart: unless-stopped

  # ── MongoDB ──
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./backups/mongo:/backups
    environment:
      MONGO_INITDB_DATABASE: sondos-portal
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ── Redis ──
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ── Qdrant Vector DB ──
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
  qdrant_data:
